spring.application.name=nihongo-backend
server.port=${PORT:8080}
# Khởi tạo chậm để khởi động nhanh hơn trên máy chủ yếu (bật khi deploy)
spring.main.lazy-initialization=${LAZY_INIT:false}

# PostgreSQL (docker-compose ở thư mục gốc, cổng 5433)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/nihongo}
spring.datasource.username=${DB_USER:nihongo}
spring.datasource.password=${DB_PASSWORD:nihongo_dev}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:10}

# Bảng do Flyway tạo (src/main/resources/db/migration), Hibernate chỉ kiểm tra
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT: đổi secret khi chạy thật (tối thiểu 32 ký tự)
app.jwt.secret=${JWT_SECRET:dev-secret-change-me-please-at-least-32-chars!!}
app.jwt.expiration-days=30

# Chatbot service (Python FastAPI)
app.chatbot.url=${CHATBOT_URL:http://localhost:8000}
app.chatbot.internal-key=${CHATBOT_INTERNAL_KEY:dev-internal-key}

# Frontend được phép gọi trực tiếp (CORS)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3100,http://localhost:3000}
